# Sobe o banco PostgreSQL e a API juntos com um único comando:
#   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data      # mantém os dados mesmo se o container parar
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # cria a tabela na primeira vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://helpdesk:helpdesk@db:5432/helpdesk
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy   # só liga a API quando o banco estiver pronto

volumes:
  dados-postgres:
